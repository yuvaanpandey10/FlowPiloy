<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | FlowPilot</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <nav class="navbar">
        <a href="index.html" class="logo">FlowPilot</a>

        <button class="menu-toggle" aria-label="Open navigation">☰</button>

        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="page-header">
        <div class="container">
          <p class="eyebrow">CONTACT US</p>
          <h1>Let's talk about your team's workflow.</h1>
        </div>
      </section>

      <section class="contact-section">
        <div class="container">
          <form class="contact-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 FlowPilot. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
